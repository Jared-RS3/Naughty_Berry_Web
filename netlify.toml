[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# `npm run dev:netlify` only — plain `npm run dev` never reads this. Pins
# netlify dev's own proxy to :5173, the port the Codespaces forwarded URL is
# hard-wired to, and pushes the underlying Vite server to :5174 instead of
# letting netlify dev auto-pick a port, which would silently break that URL.
[dev]
  command = "npm run dev -- --port 5174"
  targetPort = 5174
  port = 5173
  autoLaunch = false

# ── Security headers ────────────────────────────────────────────────────────
# Applied to every response. The CSP is written against exactly what the site
# loads today: Google Fonts, the Airtable form embed, and Google Analytics 4.
# Adding a new third-party script, font, iframe or API means adding it here too,
# or the browser will silently refuse to load it.
#
# Note what is NOT in connect-src: api.airtable.com. The browser no longer talks
# to Airtable at all — the pop-up schedule comes from /api/schedule, which holds
# the token server-side. Putting api.airtable.com back here would re-open the
# path that made a browser-side token possible in the first place.
#
# The Google Analytics entries below only permit the request; they do not make
# it. gtag.js is appended to the document by src/lib/analytics.ts and only after
# the visitor has consented, so on a page where consent was declined nothing is
# ever fetched from any of these hosts.
[[headers]]
  for = "/*"
  [headers.values]
    # HSTS: once seen, never speak plain HTTP to this host again.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Stop the browser second-guessing declared content types.
    X-Content-Type-Options = "nosniff"
    # Clickjacking: nobody frames this site but this site.
    X-Frame-Options = "SAMEORIGIN"
    # Don't leak full URLs (which can carry ?pkg= and other context) off-site.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Hardware and background APIs this site has no use for.
    Permissions-Policy = "accelerometer=(), autoplay=(self), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-site"
    # style-src needs 'unsafe-inline': Framer Motion animates via inline styles
    # and index.html carries a critical inline <style>. Scripts do NOT get that
    # exemption — the one inline script was moved to /boot-fallback.js so this
    # can stay 'self'.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; object-src 'none'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com; media-src 'self'; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; frame-src https://airtable.com; worker-src 'self' blob:; manifest-src 'self'; upgrade-insecure-requests"

# The enquiry endpoint must never be cached by a CDN or a browser.
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0"
    X-Robots-Tag = "noindex"

# Fingerprinted bundles are safe to cache forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
