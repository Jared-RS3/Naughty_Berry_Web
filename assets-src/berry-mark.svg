<!--
  Source of truth for every favicon / app icon on the site.

  It is the strawberry from naughty-berry-logo.png redrawn as clean vector. The
  logo itself cannot be cropped for this: the "N" of the wordmark sits on top of
  the berry, so any crop of the PNG carries a bite of white script with it. This
  redraw keeps the logo's exact palette (berry #DB1117, leaf #68B346, seeds
  white) and its silhouette — wide shoulders, rounded point, leaf thrown to the
  upper-left — at a weight that still reads at 16px.

  Run `npm run icons` after editing to regenerate every PNG/ICO from this file.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Naughty Berry">
  <!-- Berry body -->
  <path
    d="M256 150
       C 152 150 74 214 74 300
       C 74 386 160 462 256 486
       C 352 462 438 386 438 300
       C 438 214 360 150 256 150 Z"
    fill="#DB1117"/>

  <!-- Seeds. Slanted dashes, sparser toward the tip, same as the logo. -->
  <g fill="#FFFFFF">
    <g transform="rotate(-18 256 300)">
      <ellipse cx="176" cy="238" rx="7" ry="15"/>
      <ellipse cx="256" cy="222" rx="7" ry="15"/>
      <ellipse cx="336" cy="238" rx="7" ry="15"/>
      <ellipse cx="150" cy="318" rx="7" ry="15"/>
      <ellipse cx="230" cy="300" rx="7" ry="15"/>
      <ellipse cx="312" cy="312" rx="7" ry="15"/>
      <ellipse cx="196" cy="392" rx="7" ry="15"/>
      <ellipse cx="278" cy="386" rx="7" ry="15"/>
      <ellipse cx="244" cy="452" rx="6" ry="13"/>
    </g>
  </g>

  <!-- Leaf. Four fat blades thrown up and to the left plus a stem — the same
       off-centre crown the wordmark uses. The blades are deliberately heavy:
       anything thinner disappears entirely at 16px. -->
  <g fill="#68B346">
    <g transform="translate(202,156)">
      <g transform="rotate(172)">
        <path d="M0 0 C 32 -32 106 -44 164 -6 C 106 34 32 32 0 0 Z"/>
      </g>
      <g transform="rotate(222)">
        <path d="M0 0 C 34 -34 112 -46 172 -4 C 112 38 34 34 0 0 Z"/>
      </g>
      <g transform="rotate(272)">
        <path d="M0 0 C 28 -28 92 -38 142 -4 C 92 32 28 28 0 0 Z"/>
      </g>
      <g transform="rotate(-16)">
        <path d="M0 0 C 30 -30 100 -40 156 -6 C 100 32 30 30 0 0 Z"/>
      </g>
      <!-- Stem -->
      <path d="M-4 -12 C 26 -66 78 -108 124 -122 C 116 -80 68 -34 20 2 Z"/>
    </g>
  </g>
</svg>
