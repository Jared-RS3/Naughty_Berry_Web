<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Naughty Berry – Strawberries & Chocolate On Tap | Cape Town</title>
    <meta name="description" content="Cape Town's first strawberries & chocolate on tap. Premium dessert cups, chocolate strawberries & Dubai Chocolate Strawberries. Available at pop-ups and private events." />
    <meta name="keywords" content="Naughty Berry, strawberries chocolate Cape Town, dessert cups, Dubai chocolate strawberries, chocolate fondue, Cape Town events catering" />
    <meta name="author" content="Naughty Berry" />

    <!-- OpenGraph -->
    <meta property="og:title" content="Naughty Berry – Strawberries & Chocolate On Tap" />
    <meta property="og:description" content="Cape Town's first strawberries & chocolate on tap. Book us for your next event." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://naughtyberry.co.za" />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naughty Berry – Strawberries & Chocolate On Tap" />
    <meta name="twitter:description" content="Cape Town's first strawberries & chocolate on tap." />
    <meta name="twitter:image" content="/og-image.jpg" />

    <!-- The intro needs these before the JS bundle could ask for them. The
         poster is the first thing on screen, so it goes first. -->
    <link rel="preload" as="image" href="/loader-poster.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/naughty-berry-logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/naughty-hero-cup.webp" />

    <!--
      Boot screen. This is plain markup with inline styles so it paints on the
      first HTML parse — before the stylesheet, before the JS bundle, before
      React exists. Without it the browser shows the page background for as long
      as the bundle takes to download and execute, which read as a pink flash
      ahead of the video.

      It is a still frame of the loader film under the same gradient and mark
      that LoadingScreen draws, so when React mounts and removes #boot the swap
      is invisible and the film simply starts moving.
    -->
    <style>
      /* Page background is pink — the site is entirely pink once loaded, so any
         exposed gap or bottom overscroll must never flash the near-black loader
         colour. The loader stays dark via #boot below, which paints its own
         #1B0812 from the first frame and covers the pink until React takes over. */
      html, body { background-color: #FFDCEA; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1B0812 url('/loader-poster.jpg') center / cover no-repeat;
      }
      #boot::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 40%,
          rgba(232, 23, 109, 0.42) 0%,
          rgba(45, 18, 37, 0.84) 55%,
          rgba(20, 4, 14, 0.97) 100%
        );
      }
      #boot img {
        position: relative;
        z-index: 1;
        width: clamp(220px, 38vw, 360px);
        filter: drop-shadow(0 8px 36px rgba(232, 23, 109, 0.62));
      }
      /* The film is dimmed to brightness(0.3); the poster is dimmed to match. */
      #boot-film { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7); }
    </style>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights actually used: Nunito 400/600/700/800. Anton was
         requested but never referenced, and 500/900 are never applied. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!-- JSON-LD LocalBusiness -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FoodEstablishment",
      "name": "Naughty Berry",
      "description": "Cape Town's first strawberries & chocolate on tap – premium dessert cups and chocolate strawberries for pop-ups and private events.",
      "url": "https://naughtyberry.co.za",
      "email": "naughtyberryinfo@gmail.com",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Cape Town",
        "addressCountry": "ZA"
      },
      "sameAs": ["https://www.instagram.com/naughtyberrycpt"]
    }
    </script>
  </head>
  <body>
    <div id="boot">
      <div id="boot-film"></div>
      <img src="/naughty-berry-logo.png" alt="Naughty Berry" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <!-- Safety net: the app clears #boot as it takes over, but if the bundle
         never runs at all this stops the boot screen sealing the page shut. -->
    <script>
      setTimeout(function () {
        var b = document.getElementById('boot')
        if (b) b.remove()
      }, 12000)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
