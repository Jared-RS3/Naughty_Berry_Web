<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Icons. All generated from /naughty-berry-logo.png by `npm run icons` —
         the logo itself, trimmed and letterboxed into a square, never redrawn or
         re-proportioned. The larger sizes are listed so that tab strips, the
         bookmark bar and Android's "add to home screen" each pick the sharpest
         file rather than upscaling the 16px one. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#E8176D" />
    <meta name="apple-mobile-web-app-title" content="Naughty Berry" />

    <!-- Brand name first: the query this has to win outright is "naughty berry".
         The description leads with what a stranger searching "chocolate
         strawberry cups cape town" is looking for, because that is the phrase
         Google will bold in the result. -->
    <title>Naughty Berry | Chocolate Strawberry Cups – Cape Town</title>
    <meta name="description" content="Cape Town's first strawberries &amp; chocolate on tap. Fresh chocolate-covered strawberry cups, Dubai chocolate cups, brownie cups and strawberry iced tea — at our weekend pop-ups, or booked for weddings, birthdays and private events." />
    <meta name="author" content="Naughty Berry" />

    <!-- Crawl everything, and let Google build a full-size image preview and an
         untruncated snippet instead of its conservative defaults. -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <!-- Local intent. "chocolate strawberries near me" is a place query long
         before it is a brand one, so the city cannot only exist in prose. -->
    <meta name="geo.region" content="ZA-WC" />
    <meta name="geo.placename" content="Cape Town" />
    <meta name="geo.position" content="-33.9249;18.4241" />
    <meta name="ICBM" content="-33.9249, 18.4241" />
    <!-- Default canonical, correct for the home page. src/lib/canonical.ts
         rewrites it per route on mount — every route is served from this same
         file, so leaving it hard-coded would tell crawlers that /quote and the
         policy pages are all duplicates of the home page. -->
    <link rel="canonical" href="https://naughtyberry.co.za/" />

    <!-- OpenGraph. The image is absolute on purpose: WhatsApp, LinkedIn and a
         number of smaller unfurlers do not resolve relative og:image paths, and
         a share card that fails on WhatsApp fails where most of this site's
         traffic is actually shared. og:url is kept in step with the canonical
         by src/lib/canonical.ts. -->
    <meta property="og:site_name" content="Naughty Berry" />
    <meta property="og:title" content="Naughty Berry | Chocolate Strawberry Cups – Cape Town" />
    <meta property="og:description" content="Cape Town's first strawberries &amp; chocolate on tap. Chocolate-covered strawberry cups, Dubai chocolate cups and brownie cups — at pop-ups and private events." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://naughtyberry.co.za/" />
    <meta property="og:image" content="https://naughtyberry.co.za/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="A Naughty Berry cup of fresh strawberries drenched in milk chocolate" />
    <meta property="og:locale" content="en_ZA" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Naughty Berry | Chocolate Strawberry Cups – Cape Town" />
    <meta name="twitter:description" content="Cape Town's first strawberries &amp; chocolate on tap. Chocolate-covered strawberry cups at pop-ups and private events." />
    <meta name="twitter:image" content="https://naughtyberry.co.za/og-image.jpg" />
    <meta name="twitter:image:alt" content="A Naughty Berry cup of fresh strawberries drenched in milk chocolate" />

    <!-- The intro needs these before the JS bundle could ask for them. The
         poster is the first thing on screen, so it goes first. -->
    <link rel="preload" as="image" href="/loader-poster.jpg" fetchpriority="high" />
    <link rel="preload" as="image" href="/naughty-berry-logo.png" fetchpriority="high" />
    <link rel="preload" as="image" href="/naughty-hero-cup.webp" />

    <!--
      Boot screen. This is plain markup with inline styles so it paints on the
      first HTML parse — before the stylesheet, before the JS bundle, before
      React exists. Without it the browser shows the page background for as long
      as the bundle takes to download and execute, which read as a pink flash
      ahead of the video.

      It is a still frame of the loader film under the same gradient and mark
      that LoadingScreen draws, so when React mounts and removes #boot the swap
      is invisible and the film simply starts moving.
    -->
    <style>
      /* Page background is pink — the site is entirely pink once loaded, so any
         exposed gap or bottom overscroll must never flash the near-black loader
         colour. The loader stays dark via #boot below, which paints its own
         #1B0812 from the first frame and covers the pink until React takes over. */
      html, body { background-color: #FFDCEA; }
      #boot {
        position: fixed;
        inset: 0;
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #1B0812 url('/loader-poster.jpg') center / cover no-repeat;
      }
      #boot::after {
        content: '';
        position: absolute;
        inset: 0;
        background: radial-gradient(
          ellipse at 50% 40%,
          rgba(232, 23, 109, 0.42) 0%,
          rgba(45, 18, 37, 0.84) 55%,
          rgba(20, 4, 14, 0.97) 100%
        );
      }
      #boot img {
        position: relative;
        z-index: 1;
        width: clamp(220px, 38vw, 360px);
        filter: drop-shadow(0 8px 36px rgba(232, 23, 109, 0.62));
      }
      /* The film is dimmed to brightness(0.3); the poster is dimmed to match. */
      #boot-film { position: absolute; inset: 0; background: rgba(0, 0, 0, 0.7); }
    </style>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Only the weights actually used: Nunito 400/600/700/800. Anton was
         requested but never referenced, and 500/900 are never applied. -->
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />

    <!--
      Structured data.

      One @graph rather than three separate blocks, so the business, the site and
      the menu are linked by @id instead of being three unrelated claims about
      the same shop. This is what a search engine reads to decide that "Naughty
      Berry" is a *thing* — a business in Cape Town with a logo, an Instagram and
      a menu — rather than two words that happen to appear on a page. It is also
      what feeds the brand panel and the sitelinks.

      Everything below is asserted from the site itself: the menu mirrors
      MENU_CATEGORIES in src/components/MenuPreview.tsx and must be kept in step
      with it. Nothing here is invented — no ratings, no opening hours, no street
      address — because structured data that contradicts the page is worse than
      none, and the trading location genuinely changes week to week.
    -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://naughtyberry.co.za/#organization",
          "name": "Naughty Berry",
          "alternateName": ["Naughty Berry CPT", "Naughty Berry Cape Town"],
          "url": "https://naughtyberry.co.za/",
          "email": "naughtyberryinfo@gmail.com",
          "logo": {
            "@type": "ImageObject",
            "url": "https://naughtyberry.co.za/naughty-berry-logo.png",
            "width": 900,
            "height": 548
          },
          "image": "https://naughtyberry.co.za/og-image.jpg",
          "description": "Cape Town's first strawberries & chocolate on tap — fresh chocolate-covered strawberry cups served from a mobile trailer at pop-ups, markets and private events.",
          "areaServed": {
            "@type": "City",
            "name": "Cape Town",
            "containedInPlace": { "@type": "AdministrativeArea", "name": "Western Cape, South Africa" }
          },
          "sameAs": ["https://www.instagram.com/naughtyberrycpt"]
        },
        {
          "@type": "WebSite",
          "@id": "https://naughtyberry.co.za/#website",
          "url": "https://naughtyberry.co.za/",
          "name": "Naughty Berry",
          "description": "Cape Town's first strawberries & chocolate on tap.",
          "publisher": { "@id": "https://naughtyberry.co.za/#organization" },
          "inLanguage": "en-ZA"
        },
        {
          "@type": ["FoodEstablishment", "LocalBusiness"],
          "@id": "https://naughtyberry.co.za/#business",
          "name": "Naughty Berry",
          "description": "Cape Town's first strawberries & chocolate on tap — chocolate-covered strawberry cups, Dubai chocolate cups, brownie cups and strawberry iced tea, at weekend pop-ups and private events.",
          "url": "https://naughtyberry.co.za/",
          "email": "naughtyberryinfo@gmail.com",
          "image": "https://naughtyberry.co.za/og-image.jpg",
          "logo": "https://naughtyberry.co.za/naughty-berry-logo.png",
          "parentOrganization": { "@id": "https://naughtyberry.co.za/#organization" },
          "servesCuisine": ["Desserts", "Chocolate strawberries", "Iced tea"],
          "priceRange": "R45–R95",
          "currenciesAccepted": "ZAR",
          "address": {
            "@type": "PostalAddress",
            "addressLocality": "Cape Town",
            "addressRegion": "Western Cape",
            "addressCountry": "ZA"
          },
          "areaServed": { "@type": "City", "name": "Cape Town" },
          "hasMenu": { "@id": "https://naughtyberry.co.za/#menu" },
          "makesOffer": [
            {
              "@type": "Offer",
              "itemOffered": { "@type": "MenuItem", "name": "Dessert cups for private events" },
              "url": "https://naughtyberry.co.za/quote"
            }
          ],
          "potentialAction": {
            "@type": "ReserveAction",
            "name": "Book Naughty Berry for an event",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://naughtyberry.co.za/quote",
              "actionPlatform": [
                "http://schema.org/DesktopWebPlatform",
                "http://schema.org/MobileWebPlatform"
              ]
            }
          },
          "sameAs": ["https://www.instagram.com/naughtyberrycpt"]
        },
        {
          "@type": "Menu",
          "@id": "https://naughtyberry.co.za/#menu",
          "name": "Naughty Berry Menu",
          "url": "https://naughtyberry.co.za/naughty-berry-menu.pdf",
          "inLanguage": "en-ZA",
          "hasMenuSection": [
            {
              "@type": "MenuSection",
              "name": "Cups",
              "hasMenuItem": [
                {
                  "@type": "MenuItem",
                  "name": "Naughty Classic Cup",
                  "description": "Fresh strawberries drenched in creamy milk chocolate.",
                  "offers": { "@type": "Offer", "price": "75", "priceCurrency": "ZAR" }
                },
                {
                  "@type": "MenuItem",
                  "name": "Naughty Brownie Cup",
                  "description": "Fresh strawberries with brownie bites, drenched in creamy milk chocolate.",
                  "offers": { "@type": "Offer", "price": "75", "priceCurrency": "ZAR" }
                },
                {
                  "@type": "MenuItem",
                  "name": "Dubai Chocolate Cup",
                  "description": "Fresh strawberries drenched in creamy milk chocolate, topped with a kunafeh mixture of pistachio cream and toasted kataifi pastry.",
                  "offers": { "@type": "Offer", "price": "95", "priceCurrency": "ZAR" }
                },
                {
                  "@type": "MenuItem",
                  "name": "Dubai Chocolate Brownie Cup",
                  "description": "Kunafeh of pistachio cream and toasted kataifi pastry over fresh strawberries and fudgey brownie bites in creamy milk chocolate.",
                  "offers": { "@type": "Offer", "price": "95", "priceCurrency": "ZAR" }
                },
                {
                  "@type": "MenuItem",
                  "name": "Naughty Cream Cup",
                  "description": "Fresh strawberries layered in velvety sweetened cream, crowned with Lotus Biscoff crumbs.",
                  "offers": { "@type": "Offer", "price": "95", "priceCurrency": "ZAR" }
                },
                {
                  "@type": "MenuItem",
                  "name": "Naughty Cream Brownie Cup",
                  "description": "Fresh strawberries and fudgey brownie bites layered in velvety sweetened cream, crowned with Lotus Biscoff crumbs.",
                  "offers": { "@type": "Offer", "price": "95", "priceCurrency": "ZAR" }
                }
              ]
            },
            {
              "@type": "MenuSection",
              "name": "Iced Tea",
              "hasMenuItem": [
                {
                  "@type": "MenuItem",
                  "name": "Strawberry Peach Iced Tea",
                  "description": "A smooth mix of sun-kissed strawberry and peach, served over ice.",
                  "offers": { "@type": "Offer", "price": "45", "priceCurrency": "ZAR" }
                }
              ]
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="boot">
      <div id="boot-film"></div>
      <img src="/naughty-berry-logo.png" alt="Naughty Berry" fetchpriority="high" />
    </div>
    <div id="root"></div>
    <!-- Safety net: the app clears #boot as it takes over, but if the bundle
         never runs at all this stops the boot screen sealing the page shut. -->
    <script src="/boot-fallback.js" defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
